site_name: KPaths
site_description: Typed, comparable KeyPaths and CaseKeyPaths for Kotlin.
site_dir: build/docs/site
repo_name: Brennanium/KPaths
repo_url: https://github.com/Brennanium/KPaths

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Overview: index.md
  - Guides:
      - KeyPaths: key-paths.md
      - CaseKeyPaths: case-paths.md
      - KeyPath and CaseKeyPath recipes: recipes.md
      - KeyPath and CaseKeyPath API design: route-aware-apis.md
      - Advanced KeyPaths: advanced-paths.md
      - Generated catalogs: generation.md
      - Identity and type metadata: identity.md
  - API reference: api/index.md
