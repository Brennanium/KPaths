name: Upload Maven Central deployment

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version declared in gradle.properties (for example, 0.1.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Sign and upload release artifacts
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Confirm requested version
        run: test "${{ inputs.version }}" = "$(sed -n 's/^VERSION_NAME=//p' gradle.properties)"
      - name: Verify and upload to Maven Central
        run: ./gradlew check verifyMavenPublications publishToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}
