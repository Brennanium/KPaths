name: Deploy documentation

on:
  push:
    branches: [main]
    tags: ["[0-9]*.[0-9]*.[0-9]*"]
    paths:
      - ".github/workflows/docs.yml"
      - "build.gradle.kts"
      - "dokka-module.md"
      - "docs/**"
      - "gradle/**"
      - "kpaths-annotations/src/**"
      - "kpaths-annotations/build.gradle.kts"
      - "kpaths-core/src/**"
      - "kpaths-core/build.gradle.kts"
      - "kpaths-reflection-jvm/src/**"
      - "kpaths-reflection-jvm/build.gradle.kts"
      - "mkdocs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # A tag-triggered run still publishes the newest development site at
          # the root, alongside snapshots built from every release tag.
          ref: main
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install documentation dependencies
        run: python3 -m pip install -r docs/requirements.txt
      - name: Build documentation
        run: ./gradlew docsBuild -PdocumentationVersion=main
      - name: Build release documentation snapshots
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r version; do
            release_root="$RUNNER_TEMP/kpaths-docs-$version"
            git worktree add --detach "$release_root" "$version"
            (
              cd "$release_root"
              ./gradlew docsBuild \
                -I "$GITHUB_WORKSPACE/gradle/documentation.init.gradle.kts" \
                -PdocumentationVersion="$version"
            )
            mkdir -p "build/docs/site/$version"
            cp -a "$release_root/build/docs/site/." "build/docs/site/$version/"
            git worktree remove --force "$release_root"
          done < <(git tag --list --sort=version:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/docs/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
