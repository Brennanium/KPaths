name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      versions:
        description: Optional space- or comma-separated Kotlin versions/selectors, e.g. 2.4.0 2.5.0-dev*
        type: string
        required: false

permissions:
  contents: read

jobs:
  compiler-compatibility-matrix:
    name: Read compiler compatibility matrix
    runs-on: ubuntu-latest
    outputs:
      kotlin: ${{ steps.versions.outputs.kotlin }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Python packaging tools
        run: python -m pip install setuptools wheel
      - name: Test matrix orchestration
        run: python3 -m unittest scripts/test_matrix_package.py scripts/test_kotlin_plugin_matrix.py scripts/test_kotlin_version_resolver.py scripts/test_verify_compiler_compatibility.py scripts/test_verify_android_studio_version.py scripts/test_verify_kefs_compatibility.py
      - id: versions
        env:
          REQUESTED_VERSIONS: ${{ inputs.versions }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from kotlin_version_resolver import resolve
          selectors = os.environ['REQUESTED_VERSIONS'].replace(',', ' ').split()
          if not selectors:
              selectors = [line.strip() for line in Path('gradle/kpaths-supported-kotlin-versions.txt').read_text().splitlines()
                           if line.strip() and not line.lstrip().startswith('#')]
          if not selectors or len(selectors) != len(set(selectors)):
              raise SystemExit('The compiler compatibility matrix must contain distinct selectors')
          resolved = resolve(selectors)
          versions = list(dict.fromkeys(version for _, version in resolved))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('### Resolved Kotlin compatibility targets\n\n')
              for selector, version in resolved:
                  summary.write(f'- `{selector}` → `{version}`\n')
          print('kotlin=' + json.dumps(versions, separators=(',', ':')))
          PY

  compiler-compatibility:
    name: Compiler consumer / Kotlin ${{ matrix.kotlin }}
    needs: compiler-compatibility-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kotlin: ${{ fromJSON(needs.compiler-compatibility-matrix.outputs.kotlin) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify compiler plugin in downstream consumers
        run: python3 scripts/kotlin-plugin-matrix.py compiler '${{ matrix.kotlin }}' --jvm-only

  compiler-compatibility-native:
    name: Compiler Native consumer / Kotlin ${{ matrix.kotlin }}
    needs: compiler-compatibility-matrix
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        kotlin: ${{ fromJSON(needs.compiler-compatibility-matrix.outputs.kotlin) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Publish local test artifacts
        run: >-
          ./gradlew --no-configuration-cache -I gradle/local-test-repository.init.gradle
          :kpaths-gradle-plugin:publishAllPublicationsToConsumerVerificationRepository
          :kpaths-compiler-plugin:publishJvmPublicationToConsumerVerificationRepository
          :kpaths-core:publishKotlinMultiplatformPublicationToConsumerVerificationRepository
          :kpaths-core:publishIosSimulatorArm64PublicationToConsumerVerificationRepository
          :kpaths-annotations:publishKotlinMultiplatformPublicationToConsumerVerificationRepository
          :kpaths-annotations:publishIosSimulatorArm64PublicationToConsumerVerificationRepository
      - name: Verify generated paths on iOS simulator
        run: >-
          ./gradlew -p kpaths-compiler-plugin-compatibility-fixture
          iosSimulatorArm64Test
          -Pkpaths.testKotlinVersion=${{ matrix.kotlin }}
          --no-configuration-cache

  compiler-compatibility-preview:
    name: Experimental Kotlin compiler preview
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Probe development compiler versions
        run: python3 scripts/kotlin-plugin-matrix.py compiler --preview --jvm-only --report-json build/compiler-preview-report.json
      - name: Save resolved preview results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: compiler-preview-results
          path: build/compiler-preview-report.json
          if-no-files-found: warn

  jvm:
    name: JVM and documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install documentation dependencies
        run: python3 -m pip install -r docs/requirements.txt
      - name: Verify JVM targets and build documentation
        run: >-
          ./gradlew
          :kpaths-annotations:jvmTest
          :kpaths-core:jvmTest
          :kpaths-reflection-jvm:jvmTest
          :kpaths-ksp:jvmTest
          :kpaths-sample:jvmTest
          :kpaths-compiler-plugin-fixture:jvmTest
          :editor-testing:test
          :snapshot-testing:test
          verifyMavenPublications
          docsBuild

  ios:
    name: iOS Native
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify iOS simulator targets
        run: >-
          ./gradlew
          :kpaths-core:iosSimulatorArm64Test
          :kpaths-sample:iosSimulatorArm64Test
