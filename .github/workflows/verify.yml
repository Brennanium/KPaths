name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      versions:
        description: Optional space- or comma-separated Kotlin versions/selectors, e.g. 2.4.0 2.5.0-dev*
        type: string
        required: false

permissions:
  contents: read

jobs:
  compiler-compatibility-matrix:
    name: Read compiler compatibility matrix
    runs-on: ubuntu-latest
    outputs:
      kotlin: ${{ steps.versions.outputs.kotlin }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-knapshots
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Test matrix orchestration
        run: python3 -m unittest scripts/test_knapshots_compiler_driver.py scripts/test_knapshots_editor_driver.py
      - id: versions
        env:
          REQUESTED_VERSIONS: ${{ inputs.versions }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path
          selectors = os.environ['REQUESTED_VERSIONS'].replace(',', ' ').split()
          if not selectors:
              selectors = [line.strip() for line in Path('gradle/kpaths-supported-kotlin-versions.txt').read_text().splitlines()
                           if line.strip() and not line.lstrip().startswith('#')]
          if not selectors or len(selectors) != len(set(selectors)):
              raise SystemExit('The compiler compatibility matrix must contain distinct selectors')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('### Kotlin compatibility selectors\n\n')
              for selector in selectors:
                  summary.write(f'- `{selector}`\n')
          print('kotlin=' + json.dumps(selectors, separators=(',', ':')))
          PY

  compiler-compatibility:
    name: Compiler consumer / Kotlin ${{ matrix.kotlin }}
    needs: compiler-compatibility-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kotlin: ${{ fromJSON(needs.compiler-compatibility-matrix.outputs.kotlin) }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-knapshots
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify compiler plugin in downstream consumers
        run: ./gradlew :kpaths-compatibility:compilerCompatibility --kotlin-version '${{ matrix.kotlin }}' --platform jvm --no-configuration-cache

  compiler-compatibility-native:
    name: Compiler Native consumer / Kotlin ${{ matrix.kotlin }}
    needs: compiler-compatibility-matrix
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        kotlin: ${{ fromJSON(needs.compiler-compatibility-matrix.outputs.kotlin) }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-knapshots
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify Native compiler compatibility
        run: ./gradlew :kpaths-compatibility:compilerCompatibility --kotlin-version '${{ matrix.kotlin }}' --platform native --no-configuration-cache

  compiler-compatibility-preview:
    name: Experimental Kotlin compiler preview
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-knapshots
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Probe development compiler versions
        shell: bash
        run: |
          selectors=()
          while IFS= read -r selector; do
            [[ -z "$selector" || "$selector" == \#* ]] && continue
            selectors+=(--kotlin-version "$selector")
          done < gradle/kpaths-preview-kotlin-versions.txt
          ./gradlew :kpaths-compatibility:compilerCompatibility "${selectors[@]}" --platform jvm --no-configuration-cache
      - name: Save resolved preview results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: compiler-preview-results
          path: kpaths-compatibility/build/reports/knapshots/compiler-compatibility.json
          if-no-files-found: warn

  jvm:
    name: JVM and documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-knapshots
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install documentation dependencies
        run: python3 -m pip install -r docs/requirements.txt
      - name: Verify JVM targets and build documentation
        run: >-
          ./gradlew
          :kpaths-annotations:jvmTest
          :kpaths-core:jvmTest
          :kpaths-reflection-jvm:jvmTest
          :kpaths-ksp:jvmTest
          :kpaths-sample:jvmTest
          :kpaths-compiler-plugin-fixture:jvmTest
          verifyMavenPublications
          docsBuild

  ios:
    name: iOS Native
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-knapshots
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify iOS simulator targets
        run: >-
          ./gradlew
          :kpaths-core:iosSimulatorArm64Test
          :kpaths-sample:iosSimulatorArm64Test
